<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Assignment 5</title>
</head>
<body>
    <div class="m-3">
      <h2>Create / Update Profile</h2>
      <form id="profileForm">
        <label for="username">Username</label><br>
        <input type="text" id="username" placeholder="Enter your name" required><br>
 
        <label for="birthYear">Birth Year</label><br>
        <input type="number" id="birthYear" placeholder="e.g. 2000" required><br>
 
        <button type="submit" class="btn btn-primary mt-2">Create / Update Profile</button>
      </form>
      <p id="message"></p>
    </div>

    <div class="m-3">
      <h2>My Hobbies / Tasks</h2>
      <ul id="itemList">
        <li>basketball</li>
        <li>music</li>
        <li>videogames</li>
      </ul>
      <input type="text" id="newItem" placeholder="New item..." class="m-2">
      <div>
        <button id="addBtn" type="button" class="btn btn-primary">Add Item</button>
        <button id="removeBtn" type="button" class="btn btn-danger">Remove Item</button>
      </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
